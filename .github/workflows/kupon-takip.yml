name: Kupon takip

on:
  schedule:
    - cron: '*/15 * * * *'   # 15 dakikada bir mağazaları gez (GitHub birkaç dakika geciktirebilir)
    - cron: '5 5 * * *'      # her sabah 08:05 (TR): ek olarak "en yeniler" + "çok satanlar" listeleri
  workflow_dispatch:
    inputs:
      listeler:
        description: 'En yeniler / çok satanlar listelerini de topla'
        type: boolean
        default: false
      sadece:
        description: 'Yalnız bu mağazaları dene (ör. Koton,Mango). Geçmişe ve sayfaya dokunmaz.'
        type: string
        default: ''
      deneme:
        description: 'Telegram biçimini görmek için DENEME mesajı gönder (yalnız Koton okunur)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kupon-takip
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Tarayıcı: GitHub makinelerinde hazır kurulu Google Chrome kullanılıyor (Playwright indirmesi yok)
      - name: Emoji yazı tipi
        run: |
          mkdir -p ~/.fonts
          curl -sSL -o ~/.fonts/NotoColorEmoji.ttf https://github.com/googlefonts/noto-emoji/raw/main/fonts/NotoColorEmoji.ttf
          fc-cache -f > /dev/null
          google-chrome --version
      # Önceki çalışmadan kalanlar: görülen/bildirilen kodlar ve sabah toplanan listeler
      - uses: actions/cache/restore@v4
        with:
          path: |
            gecmis.json
            magazalar/*-en-yeniler.json
            magazalar/*-cok-satanlar.json
          key: gecmis-${{ github.run_id }}
          restore-keys: gecmis-
      # Görünür tarayıcı gerekiyor (headless Cloudflare'a takılabilir): sanal ekranda çalıştır
      - name: Mağazaları gez
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_KANAL_ID: ${{ secrets.TELEGRAM_KANAL_ID }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          FLAG=""
          if [ "${{ github.event.schedule }}" = "5 5 * * *" ] || [ "${{ inputs.listeler }}" = "true" ]; then FLAG="--listeler"; fi
          if [ -n "${{ inputs.sadece }}" ]; then FLAG="$FLAG --sadece=${{ inputs.sadece }}"; fi
          if [ "${{ inputs.deneme }}" = "true" ]; then FLAG="--sadece=Koton"; fi
          xvfb-run -a node magazalar-test.js --headful $FLAG
          if [ "${{ inputs.deneme }}" = "true" ]; then node deneme-bildirim.js; fi
      # Teşhis: ekran görüntüleri ve verisi okunamayan sayfaların HTML'i (3 gün saklanır)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teshis
          path: |
            magazalar/*.png
            magazalar/*-sayfa.html
            magazalar-deneme.json
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/cache/save@v4
        if: always() && hashFiles('gecmis.json') != '' && inputs.sadece == '' && inputs.deneme != true
        with:
          path: |
            gecmis.json
            magazalar/*-en-yeniler.json
            magazalar/*-cok-satanlar.json
          key: gecmis-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        if: inputs.sadece == '' && inputs.deneme != true
        with:
          path: site

  yayinla:
    needs: topla
    if: inputs.sadece == '' && inputs.deneme != true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
